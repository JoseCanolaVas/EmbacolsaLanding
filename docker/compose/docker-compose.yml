name: embacolsa

services:
  database:
    image: postgres:16-alpine
    container_name: embacolsa-postgres
    env_file:
      - ../../env/database.env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: embacolsa-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  backend:
    image: embacolsa-api:local
    container_name: embacolsa-api
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    env_file:
      - ../../env/backend.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: database
      DB_PORT: 5432
      REDIS_HOST: redis
    volumes:
      - backend_storage:/var/www/html/storage
    expose:
      - "9000"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: embacolsa-frontend:local
    container_name: embacolsa-frontend
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
      args:
        API_URL: /api
        BACKEND_URL: http://backend
    env_file:
      - ../../env/frontend.env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
      API_URL: /api
      BACKEND_URL: http://backend
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: embacolsa-nginx
    ports:
      - "80:80"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_storage:/var/www/backend/storage:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_storage:
