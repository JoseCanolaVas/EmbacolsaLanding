name: softnova

services:

  redis:
    image: redis:7-alpine
    container_name: softnova-redis

    volumes:
      - redis_data:/data

    restart: unless-stopped


  backend:
    image: softnova-api:local
    container_name: softnova-api

    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile

    env_file:
      - ../../env/api.env

    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      REDIS_HOST: redis

    expose:
      - "9000"

    depends_on:
      - redis

    restart: unless-stopped


  frontend:
    image: softnova-frontend:local
    container_name: softnova-frontend

    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile

    env_file:
      - ../../env/frontend.env

    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production

    expose:
      - "3000"

    depends_on:
      - backend

    restart: unless-stopped


  nginx:
    image: nginx:alpine
    container_name: softnova-nginx

    ports:
      - "80:80"

    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - frontend
      - backend

    restart: unless-stopped


volumes:
  redis_data: